<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusQuery AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            🤖 CampusQuery AI
        </div>

        <div class="header-subtitle">
            College Information Assistant
        </div>
    </header>


    <!-- Main Chat Area -->
    <main class="chat-container">

        <!-- Welcome Message -->
        <section class="welcome-section">

            <h1>Welcome to CampusQuery AI 👋</h1>

            <p>
                Ask questions about college notices, academic information,
                PDFs, circulars and other campus documents.
            </p>

        </section>


        <!-- Chat Messages -->
        <section id="chatMessages" class="chat-messages">

            <div class="message bot-message">
                <strong>CampusQuery AI 🤖</strong>

                <p>
                    Hello! How can I help you today?
                </p>
            </div>

        </section>


        <!-- Chat Input -->
        <section class="input-section">

            <input
                type="text"
                id="userInput"
                placeholder="Ask something about your college..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>
            CampusQuery AI • AI-powered College Information Assistant
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
